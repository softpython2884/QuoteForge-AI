<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuoteForge - Enterprise Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-orange-50 font-sans min-h-screen">
    <div class="max-w-4xl mx-auto py-12 px-4">
        <h1 class="text-3xl font-bold text-orange-900 mb-8">Enterprise Data Manager</h1>

        <!-- Auth Section -->
        <div id="auth-section" class="bg-white p-6 rounded-lg shadow-sm mb-8 border border-orange-200">
            <h2 class="text-xl font-semibold mb-4 text-orange-800">1. Manager Login</h2>
            <div class="flex gap-4">
                <input type="text" id="companyId" value="comp_1"
                    class="flex-1 border rounded px-4 py-2 border-orange-300">
                <button onclick="login()" class="bg-orange-600 text-white px-6 py-2 rounded hover:bg-orange-700">Access
                    Catalog</button>
            </div>
            <p id="auth-status" class="mt-2 text-sm text-gray-500"></p>
        </div>

        <div id="product-form"
            class="bg-white p-6 rounded-lg shadow-sm border border-orange-200 opacity-50 pointer-events-none transition">
            <h2 class="text-xl font-semibold mb-6 flex items-center text-orange-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
                Add New Product
            </h2>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Product Name</label>
                    <input type="text" id="pName" placeholder="e.g. Oak Flooring" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Category</label>
                    <input type="text" id="pCategory" placeholder="e.g. FLOORING" class="w-full border p-2 rounded">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Base Price (€)</label>
                    <input type="number" id="pPrice" placeholder="45.00" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Unit ID</label>
                    <input type="text" id="pUnit" value="unit_m2" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Currency</label>
                    <input type="text" id="pCurrency" value="EUR" readonly
                        class="w-full border p-2 rounded bg-gray-100">
                </div>
            </div>

            <button onclick="createProduct()"
                class="w-full bg-orange-600 text-white py-3 rounded font-bold hover:bg-orange-700 shadow-lg">Add to
                Catalog</button>
        </div>

        <!-- Catalog Preview -->
        <div class="mt-12">
            <h3 class="text-lg font-bold text-orange-900 mb-4">Current Products</h3>
            <div id="product-list" class="space-y-2">
                <!-- Items -->
            </div>
        </div>
    </div>

    <script>
        let token = null;
        const API_URL = 'http://localhost:3000';

        async function login() {
            const companyId = document.getElementById('companyId').value;
            try {
                // Enterprise usually needs auth too, here reusing basic auth
                const res = await axios.post(`${API_URL}/auth/login`, { companyId });
                token = res.data.access_token;
                document.getElementById('auth-status').innerText = "Access Granted.";
                document.getElementById('auth-status').className = "mt-2 text-sm text-green-600";

                document.getElementById('product-form').classList.remove('opacity-50', 'pointer-events-none');
                loadProducts(companyId);
            } catch (e) {
                alert('Login failed');
            }
        }

        async function createProduct() {
            const companyId = document.getElementById('companyId').value;
            const payload = {
                companyId: companyId,
                name: document.getElementById('pName').value,
                basePrice: Number(document.getElementById('pPrice').value),
                unitId: document.getElementById('pUnit').value,
                category: document.getElementById('pCategory').value,
                currency: 'EUR'
            };

            try {
                // Note: Auth isn't strict on this endpoint in current logic (public catalog), but good to have
                await axios.post(`${API_URL}/products`, payload);
                alert('Product Created!');
                loadProducts(companyId);
            } catch (e) {
                alert('Error creating product: ' + e.message);
            }
        }

        async function loadProducts(companyId) {
            try {
                const res = await axios.get(`${API_URL}/products?companyId=${companyId}`);
                const list = document.getElementById('product-list');
                list.innerHTML = '';
                res.data.forEach(p => {
                    const div = document.createElement('div');
                    div.className = "bg-white p-4 rounded shadow-sm border border-orange-100 flex justify-between";
                    div.innerHTML = `
                        <span class="font-medium text-gray-800">${p.name}</span>
                        <span class="text-orange-600 font-bold">${p.basePrice} €</span>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>

</html>
