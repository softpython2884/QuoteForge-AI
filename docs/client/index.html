<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuoteForge - Client Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-gray-50 font-sans">
    <div class="max-w-4xl mx-auto py-12 px-4">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Client Quote Request</h1>

        <!-- Auth Section -->
        <div id="auth-section" class="bg-white p-6 rounded-lg shadow-sm mb-8 border border-gray-200">
            <h2 class="text-xl font-semibold mb-4">1. Login</h2>
            <div class="flex gap-4">
                <input type="text" id="companyId" placeholder="Enter Company ID (e.g. comp_1)"
                    class="flex-1 border rounded px-4 py-2">
                <button onclick="login()"
                    class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700">Login</button>
            </div>
            <p id="auth-status" class="mt-2 text-sm text-gray-500"></p>
        </div>

        <!-- Quote Form -->
        <div id="quote-section"
            class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 opacity-50 pointer-events-none transition">
            <h2 class="text-xl font-semibold mb-4">2. Describe your needs</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Customer Name</label>
                <input type="text" id="customerName" value="Test Customer" class="w-full border rounded px-4 py-2">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Request Details</label>
                <textarea id="requestText" rows="4" class="w-full border rounded px-4 py-2"
                    placeholder="e.g. I need to tile 45m2 of living room floor..."></textarea>
            </div>
            <button onclick="generateQuote()"
                class="w-full bg-green-600 text-white py-3 rounded font-bold hover:bg-green-700">Generate Quote</button>
        </div>

        <!-- Result -->
        <div id="result-section" class="mt-8 hidden">
            <h2 class="text-xl font-semibold mb-4">Generated Quote</h2>
            <div class="bg-white p-6 rounded-lg shadow-lg border border-gray-200">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <div>
                        <p class="text-sm text-gray-500">Reference</p>
                        <p id="q-ref" class="font-mono font-bold text-lg">Q-...</p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-500">Total Amount</p>
                        <p id="q-total" class="text-3xl font-bold text-indigo-600">0.00 €</p>
                    </div>
                </div>

                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-500 text-sm border-b">
                            <th class="pb-2">Description</th>
                            <th class="pb-2 text-right">Qty</th>
                            <th class="pb-2 text-right">Unit Price</th>
                            <th class="pb-2 text-right">Total</th>
                        </tr>
                    </thead>
                    <tbody id="q-lines">
                        <!-- Lines here -->
                    </tbody>
                </table>

                <div id="q-audit" class="mt-6 bg-slate-50 p-4 rounded text-xs text-slate-500 font-mono">
                    Audit: AI Confidence <span id="q-conf">...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let token = null;
        const API_URL = 'http://localhost:3000';

        async function login() {
            const companyId = document.getElementById('companyId').value;
            try {
                const res = await axios.post(`${API_URL}/auth/login`, { companyId });
                token = res.data.access_token;
                document.getElementById('auth-status').innerText = "Logged in!";
                document.getElementById('auth-status').className = "mt-2 text-sm text-green-600";

                // Enable quote section
                const section = document.getElementById('quote-section');
                section.classList.remove('opacity-50', 'pointer-events-none');
            } catch (e) {
                alert('Login failed: ' + (e.response?.data?.message || e.message));
            }
        }

        async function generateQuote() {
            const requestText = document.getElementById('requestText').value;
            const customerName = document.getElementById('customerName').value;

            try {
                const res = await axios.post(`${API_URL}/quotes/generate`, {
                    requestText,
                    customerName
                }, {
                    headers: { Authorization: `Bearer ${token}` }
                });

                const quote = res.data;
                renderQuote(quote);
            } catch (e) {
                alert('Generation failed: ' + (e.response?.data?.message || e.message));
            }
        }

        function renderQuote(quote) {
            document.getElementById('result-section').classList.remove('hidden');
            document.getElementById('q-ref').innerText = quote.reference;
            document.getElementById('q-total').innerText = Number(quote.totalAmount).toFixed(2) + ' €';

            const tbody = document.getElementById('q-lines');
            tbody.innerHTML = '';

            quote.lines.forEach(line => {
                const tr = document.createElement('tr');
                tr.className = "border-b last:border-0";
                tr.innerHTML = `
                    <td class="py-3">${line.description}</td>
                    <td class="py-3 text-right">${line.quantity}</td>
                    <td class="py-3 text-right">${Number(line.unitPrice).toFixed(2)}</td>
                    <td class="py-3 text-right font-medium">${Number(line.totalPrice).toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });

            const confidence = quote.aiResponse?.confidence || 'N/A';
            document.getElementById('q-conf').innerText = confidence;
        }
    </script>
</body>

</html>
